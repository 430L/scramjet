<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Launcher</title>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #0f0f0f;
			color: #e5e7eb;
			font-family: system-ui, -apple-system, sans-serif;
		}
		#launcher {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100%;
			gap: 1em;
		}
		#launcher button {
			background: #1a1a1a;
			border: 1px solid #2a2a2a;
			color: #e5e7eb;
			padding: 0.75em 1.5em;
			border-radius: 6px;
			font-size: 1em;
			cursor: pointer;
		}
		#launcher button:hover { background: #222; }
		#launcher p { max-width: 32em; color: #8f8f8f; text-align: center; }
	</style>
</head>
<body>
	<!--
		Canonical trampoline launcher.

		The invariant this file protects: **the URL bar of the launched tab
		stays on `about:blank` forever, regardless of what proxied content
		tries to do.**

		PREREQUISITE (enforced at runtime): this launcher MUST be served from a
		different origin than the proxy. The about:blank tab inherits THIS
		page's origin, while the injected iframe keeps the proxy origin (it
		needs allow-same-origin for the service worker). If those match, the
		sandboxed iframe is same-origin with the non-sandboxed shell and can
		script it into navigating the real tab, bypassing the sandbox entirely.
		`isSameOriginAsProxy()` below refuses to launch in that case. With that
		held, two layers make the invariant stick:

		1. TRAMPOLINE PATTERN.
		   A user gesture (the Launch button) calls
		   `window.open("about:blank")`. The browser opens a new tab whose
		   document.location is literally about:blank. We then
		   `document.write` a minimal shell into that tab containing a
		   single <iframe> pointing at the proxy origin. The outer document
		   never navigates, so the URL bar keeps showing about:blank
		   permanently.

		2. IFRAME SANDBOX (the load-bearing part).
		   The injected iframe carries `sandbox="…"` WITHOUT the tokens that
		   let content escape:
		     - allow-top-navigation
		     - allow-top-navigation-by-user-activation
		     - allow-top-navigation-to-custom-protocols
		     - allow-popups
		     - allow-popups-to-escape-sandbox
		   Without those, the BROWSER (not the runtime) physically refuses
		   to let content inside the iframe change the outer tab's URL, or
		   open a new top-level tab that would expose the raw proxy origin.
		   target=_blank on an anchor, `window.open`, `<meta http-equiv=
		   refresh>`, `window.top.location =`, middle-click, ctrl-click —
		   all blocked at the browser level.

		   The tokens we DO grant are the minimum the proxy needs:
		     allow-scripts               (all JS)
		     allow-same-origin           (SW registration, cookies, storage)
		     allow-forms                 (form submissions inside proxied sites)
		     allow-modals                (alert / confirm / prompt)
		     allow-downloads             (downloadable content)
		     allow-storage-access-by-user-activation
		     allow-pointer-lock          (games / canvas)
		     allow-orientation-lock
		     allow-presentation

		The Scramjet runtime ALSO installs `confineNavigation` inside the
		iframe so it never even *tries* to escape. Keep BOTH layers — the
		sandbox is the physical guarantee, the runtime flag is the polite
		defense. Removing either turns any bug in the other into a full
		escape.

		THE LOADING STATE MATTERS. The shell paints the same near-black as
		the app, so an iframe that never loads is indistinguishable from one
		that loaded fine — that is what a "black screen where nothing
		happens" actually is. The shell therefore starts with a visible
		status overlay and only hides it once the app inside reports that it
		booted (a postMessage the app sends to its parent). If the app
		reports failure, or nothing arrives at all before the backstop
		timeout, the overlay turns into an error with a way out.

		To customize: change PROXY_URL below, or pass ?url=<proxy origin>.
	-->
	<div id="launcher">
		<button id="go" type="button">Launch</button>
		<p>Opens a new tab whose URL bar stays on <code>about:blank</code>.</p>
	</div>
	<script>
		// Default proxy origin. Overridable per-visit with ?url=… so one
		// copy of this file can point at a staging deploy without an edit.
		var DEFAULT_PROXY_URL = "https://scramjet-3oyx.onrender.com/";

		// Only http(s) targets. Without this check a ?url=javascript:… would
		// end up in the iframe's src attribute.
		function resolveProxyUrl() {
			try {
				var requested = new URL(location.href).searchParams.get("url");
				if (!requested) return DEFAULT_PROXY_URL;
				var parsed = new URL(requested, location.href);
				if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
					return DEFAULT_PROXY_URL;
				}
				return parsed.href;
			} catch (e) {
				return DEFAULT_PROXY_URL;
			}
		}

		var PROXY_URL = resolveProxyUrl();

		// The trampoline's guarantee is only physical when this launcher is
		// served from a DIFFERENT origin than the proxy. window.open("about:blank")
		// makes the new tab inherit THIS page's origin; the injected iframe keeps
		// its own (proxy) origin because it needs allow-same-origin for the
		// service worker. If those two origins match, the sandboxed iframe is
		// same-origin with the non-sandboxed shell and can reach into the shell's
		// realm (parent.eval, injecting a <script>, or stripping the sandbox
		// attribute) to make the shell navigate the real tab — defeating the
		// whole point. So refuse to launch in that configuration. (It is also
		// self-defeating: a launcher hosted on a blocked proxy origin is itself
		// blocked.) Host launcher.html anywhere else — a local file, an extension
		// page, or any non-proxy domain.
		function isSameOriginAsProxy() {
			try {
				return new URL(PROXY_URL).origin === location.origin;
			} catch (e) {
				return false;
			}
		}

		function showSameOriginError() {
			var launcher = document.getElementById("launcher");
			if (!launcher) return;
			launcher.textContent = "";
			var title = document.createElement("p");
			title.textContent =
				"This launcher can't run from the proxy's own origin.";
			var detail = document.createElement("p");
			detail.textContent =
				"It is being served from " + location.origin + ", the same origin " +
				"as the proxy. The about:blank trampoline can only keep the real " +
				"URL bar hidden when the launcher is hosted on a different origin. " +
				"Host launcher.html somewhere else — a local file, a browser " +
				"extension page, or any non-proxy domain — and open it from there.";
			launcher.appendChild(title);
			launcher.appendChild(detail);
		}

		// How long to wait for the app to report a successful boot before
		// declaring the launch failed. Deliberately generous: a host that
		// sleeps when idle can take the better part of a minute to answer,
		// and the app's own boot budget runs to roughly 85s, so a shorter
		// timeout here would call failure while the app is still working.
		var BOOT_TIMEOUT_MS = 90000;
		// When to admit that this is taking a while.
		var SLOW_HINT_MS = 10000;

		// The sandbox tokens listed here are load-bearing. Do NOT add
		// allow-top-navigation, allow-top-navigation-by-user-activation,
		// allow-top-navigation-to-custom-protocols, allow-popups, or
		// allow-popups-to-escape-sandbox — any one of them lets proxied
		// content take over the outer tab's URL bar.
		var SANDBOX = [
			"allow-scripts",
			"allow-same-origin",
			"allow-forms",
			"allow-modals",
			"allow-downloads",
			"allow-storage-access-by-user-activation",
			"allow-pointer-lock",
			"allow-orientation-lock",
			"allow-presentation"
		].join(" ");

		function escapeAttr(s) {
			return String(s)
				.replace(/&/g, "&amp;")
				.replace(/"/g, "&quot;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;");
		}

		function shellStyles() {
			return "html,body{margin:0;padding:0;height:100%;background:#0f0f0f;" +
				"color:#e5e7eb;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}" +
				"iframe{margin:0;padding:0;border:0;width:100%;height:100%;display:block;background:#0f0f0f}" +
				"#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;" +
				"background:#0f0f0f;transition:opacity .25s ease}" +
				"#ov.hidden{opacity:0;pointer-events:none}" +
				"#box{display:flex;flex-direction:column;align-items:center;gap:.85em;padding:2em;" +
				"text-align:center;max-width:32em}" +
				"#msg{margin:0;font-size:1em;color:#e5e7eb}" +
				"#hint{margin:0;font-size:.85em;color:#8f8f8f;overflow-wrap:anywhere}" +
				"#acts{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}" +
				"#acts button{background:#1a1a1a;border:1px solid #2a2a2a;color:#e5e7eb;" +
				"padding:.6em 1.2em;border-radius:6px;font-size:.9em;font-family:inherit;cursor:pointer}" +
				"#acts button:hover{background:#222}" +
				"#sp{width:1.6em;height:1.6em;border:2px solid #2a2a2a;border-top-color:#8f8f8f;" +
				"border-radius:50%;animation:spin .9s linear infinite}" +
				"#sp.done{display:none}" +
				"@keyframes spin{to{transform:rotate(360deg)}}" +
				"@media (prefers-reduced-motion:reduce){#sp{animation:none}}";
		}

		// Runs inside the launched tab. Kept as a function so it can be
		// stringified into the shell rather than maintained as a string.
		function shellBootstrap(proxyUrl, bootTimeoutMs, slowHintMs) {
			var frame = document.getElementById("f");
			var overlay = document.getElementById("ov");
			var msg = document.getElementById("msg");
			var hint = document.getElementById("hint");
			var acts = document.getElementById("acts");
			var spinner = document.getElementById("sp");
			var settled = false;
			var timers = [];

			function clearTimers() {
				for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
				timers = [];
			}

			function succeed() {
				if (settled) return;
				settled = true;
				clearTimers();
				overlay.className = "hidden";
			}

			function fail(text) {
				if (settled) return;
				settled = true;
				clearTimers();
				spinner.className = "done";
				msg.textContent = "Couldn't load";
				hint.textContent = text;

				var retry = document.createElement("button");
				retry.type = "button";
				retry.textContent = "Try again";
				retry.onclick = function () {
					// Full reload of the shell, not just the iframe: a failed
					// boot can leave a half-registered service worker behind,
					// and re-pointing src alone would inherit it. location.reload
					// stays on about:blank, so it never exposes the origin.
					location.reload();
				};

				// There is deliberately NO "open directly" button here. It used
				// to window.open(proxyUrl) as an escape hatch, but that opens a
				// real top-level tab showing the raw proxy origin in the address
				// bar — exactly the exposure this trampoline exists to prevent,
				// and on a blocked host it lands the user on the block page. A
				// boot failure is almost always a cold-starting host; retrying
				// (or waiting) is the only safe recovery, so that is all we
				// offer.
				acts.appendChild(retry);
			}

			// The app posts this once its service worker and proxy runtime are
			// up. It is the only reliable success signal available: the iframe
			// is cross-origin so its contents cannot be inspected, and its
			// `load` event fires for browser error pages too.
			window.addEventListener("message", function (e) {
				if (e.source !== frame.contentWindow) return;
				var data = e.data;
				if (!data || typeof data !== "object") return;
				if (data.__akBoot === "ready") succeed();
				else if (data.__akBoot === "error") {
					fail(data.message || "The proxy failed to start.");
				}
			});

			timers.push(setTimeout(function () {
				if (settled) return;
				hint.textContent =
					"Still connecting. The server may be waking up from sleep, " +
					"which can take up to a minute.";
			}, slowHintMs));

			timers.push(setTimeout(function () {
				fail(
					"No response from " + proxyUrl + " after " +
					Math.round(bootTimeoutMs / 1000) + " seconds."
				);
			}, bootTimeoutMs));
		}

		function launch() {
			// Refuse if the shell would be same-origin with the proxy iframe —
			// the sandbox is not a real wall in that configuration (see
			// isSameOriginAsProxy above).
			if (isSameOriginAsProxy()) {
				showSameOriginError();
				return;
			}

			// Must be inside the click handler for the popup-blocker
			// heuristic to treat this as user-initiated.
			var win = window.open("about:blank");
			if (!win) {
				alert("Popup blocked. Allow popups for this page and try again.");
				return;
			}

			// Build the shell as an HTML string. document.write into the
			// about:blank tab replaces its (empty) document with this shell.
			// The outer tab's location stays about:blank because we never
			// call win.location.href = anything.
			//
			// escapeAttr keeps a maliciously configured PROXY_URL from
			// breaking out of the sandbox attribute. Same for the URL
			// itself — anchoring the sandbox and src as attributes is
			// safe as long as they can't be quote-escaped.
			var bootstrap =
				"(" + shellBootstrap.toString() + ")(" +
				JSON.stringify(PROXY_URL) + "," +
				BOOT_TIMEOUT_MS + "," + SLOW_HINT_MS + ");";

			var html =
				"<!DOCTYPE html>" +
				"<html><head><meta charset=\"utf-8\"><title>Loading...</title>" +
				"<style>" + shellStyles() + "</style>" +
				"</head><body>" +
				"<iframe id=\"f\" sandbox=\"" + escapeAttr(SANDBOX) + "\" src=\"" +
				escapeAttr(PROXY_URL) + "\" allow=\"clipboard-read; clipboard-write\"></iframe>" +
				"<div id=\"ov\"><div id=\"box\">" +
				"<div id=\"sp\"></div>" +
				"<p id=\"msg\">Connecting…</p>" +
				"<p id=\"hint\"></p>" +
				"<div id=\"acts\"></div>" +
				"</div></div>" +
				// The closing tag is split so this string can't terminate the
				// <script> block that contains it.
				"<scr" + "ipt>" + bootstrap + "</scr" + "ipt>" +
				"</body></html>";

			try {
				win.document.open();
				win.document.write(html);
				win.document.close();
			} catch (e) {
				// Extremely unlikely — same-origin about:blank inherits our
				// origin so document.write is always allowed. If a future
				// browser change breaks this, fall through and tell the user.
				alert("Failed to initialise the launcher tab: " + e);
			}
		}

		// Surface the misconfiguration immediately rather than waiting for a
		// click, so a launcher accidentally deployed onto the proxy origin is
		// obvious on load.
		if (isSameOriginAsProxy()) {
			showSameOriginError();
		} else {
			document.getElementById("go").addEventListener("click", launch);
		}
	</script>
</body>
</html>
